[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fit2l3l"
version = "0.1.0"
description = "cabinetry + pyhf statistical analysis framework for the 2L/3L (SS/3L) analyses"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "cabinetry>=0.6.0",
    "pyhf>=0.7.5",
    "iminuit>=2.20",
    "uproot>=5",
    "boost-histogram>=1.3",
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
    "jsonpatch",
    "tabulate",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
fit2l3l = "fit2l3l.cli.main:main"

[tool.setuptools.packages.find]
include = ["fit2l3l*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
